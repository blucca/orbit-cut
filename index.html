<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171b35" />
    <meta name="description" content="Turn a 360 video cut back toward the story. A seated, hands-first editing workbench with local MP4 export." />
    <link rel="icon" href="data:," />
    <title>Orbit Cut — keep the story in view</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #171b35; color: #f4ebd9; font: 15px 'Trebuchet MS', sans-serif; }
      #scene-container { height: 100vh; height: 100dvh; }
      #file-bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); width: min(720px, calc(100% - 24px)); padding: 12px 16px; background: #171b35ef; border-radius: 12px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
      button, input, .file-button, a { font: inherit; }
      button, .file-button { padding: 9px 12px; border: 0; border-radius: 7px; background: #f5a15e; color: #171b35; cursor: pointer; }
      .file-button { position: relative; overflow: hidden; }
      .file-button input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
      input[type=number] { width: 62px; background: #292e50; color: #f4ebd9; border: 1px solid #8f93ad; border-radius: 5px; padding: 7px; }
      :focus-visible, .file-button:focus-within { outline: 3px solid #f4ebd9; outline-offset: 3px; }
      #media-message { width: 100%; margin: 0; color: #b7bad1; font-size: 13px; }
      #download, #sample-credit a { color: #f5a15e; }
      #sample-credit { width: 100%; margin: 0; color: #b7bad1; font-size: 12px; }
      @media (max-width: 520px) { #file-bar { font-size: 13px; bottom: 8px; padding: 10px; } }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <aside id="file-bar" aria-label="Video file and immersive session">
      <label class="file-button">Open 360 video<input id="open-file" type="file" accept="video/mp4" aria-label="Open local monoscopic 2:1 video" /></label>
      <button id="practice-waterfall">Waterfall practice</button>
      <label>Selected cut <input id="cut-seconds" type="number" min="0.1" max="59.9" step="0.1" value="4" /> s</label>
      <button id="enter-xr">Enter immersive workbench</button>
      <a id="download" hidden download="orbit-cut.mp4">Save last export</a>
      <p id="media-message" role="status">Loading the 12-second, two-cut synthetic practice film. Your files stay in this browser.</p>
      <p id="sample-credit" hidden>Camera film by <a href="https://commons.wikimedia.org/wiki/File:20180407_132600_Ess-Na-Crub_Waterfall.webm" target="_blank" rel="noreferrer">Bernard Ladenthin</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noreferrer">CC BY 4.0</a>. Orbit Cut added the direction jump at 5 seconds. Retain attribution when sharing an export.</p>
    </aside>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
