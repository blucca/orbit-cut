name: Orbit Cut runtime and media
on: [push, workflow_dispatch]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: xr-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IWSDK_GPU: swiftshader
      NODE_OPTIONS: --max-old-space-size=4096
      TMPDIR: ${{ github.workspace }}/temp
      npm_config_cache: ${{ github.workspace }}/temp/npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/temp/pw-browsers
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p temp
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact dependencies and Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Typecheck and real emulated interaction
        run: |
          npm run --if-present typecheck
          python3 scripts/xr-smoke.py
      - name: Native MP4 pixel export and reopen
        run: ORBIT_MEDIA_OUTPUT="$PWD/temp/media" node scripts/media-smoke.mjs
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xr-runtime-evidence
          retention-days: 7
          path: |
            temp/*.json
            temp/*.png
            temp/*.log
            temp/media/
            .iwsdk/runtime/logs/*.log
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: runtime
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish tested workbench
        id: deployment
        uses: actions/deploy-pages@v4
